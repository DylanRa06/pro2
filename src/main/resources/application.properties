spring.application.name=patitas_rescate
# Configuracion de la conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/patitas_rescate
spring.datasource.username=postgres
spring.datasource.password=melany123

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evitar consultas durante la serializacion de respuestas
spring.jpa.open-in-view=false
